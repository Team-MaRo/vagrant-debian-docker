# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Note: unique combination of 'package-ecosystem', 'directory', and 'target-branch'
# target-branch is omitted, so updates target the default branch (master).

version: 2
updates:
  # Keep the GitHub Actions used by our workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    labels:
      - "dependabot :robot:"
    schedule:
      interval: weekly # on monday
      time: '09:30'
      timezone: Europe/Zurich
    groups:
      github-actions:
        update-types:
          - minor
          - patch

  # The example image used by the test setup (test/Dockerfile -> php:8.2-fpm).
  - package-ecosystem: docker
    directory: /test
    labels:
      - "dependabot :robot:"
    schedule:
      interval: weekly
      time: '09:30'
      timezone: Europe/Zurich
